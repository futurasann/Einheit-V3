<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EINHEIT | Brand Rank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0A0B09; --surf:#12140F; --surf-2:#191C15;
            --line:#262B22; --line-thick:#3A4234;
            --ink:#F3F5EE; --dim:#8D9788;
            --accent:#FFFFFF; --accent-ink:#0A0B09; --accent-2:#FF6A3D;
            --r-xl:32px; --r-lg:24px; --r-md:16px; --r-sm:10px;
            --max-w-desktop: 1120px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif; margin: 0; padding: 0; overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased; }
        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
        ::selection { background: var(--accent); color: var(--accent-ink); }

        #curtain { position: fixed; inset: 0; background: var(--bg); z-index: 100000; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s var(--ease), visibility 0.8s var(--ease); }
        #curtain.done { opacity: 0; visibility: hidden; pointer-events: none; }
        #curtain .mark { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 6px; color: var(--dim); opacity: 0; animation: markFade 1.2s var(--ease) forwards; }
        @keyframes markFade { 0% { opacity: 0; transform: scale(0.92); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.02); } }

        .skeleton { background: linear-gradient(90deg, var(--surf) 25%, var(--surf-2) 50%, var(--surf) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        /* NAVIGATION */
        nav { display: flex; justify-content: center; align-items: center; position: fixed; width: 100%; top: 18px; z-index: 9999; padding: 0 15px; }
        .nav-container { width: 100%; max-width: var(--max-w-desktop); display: flex; justify-content: space-between; align-items: center; padding: 0 14px 0 26px; background: rgba(18, 20, 15, 0.88); backdrop-filter: blur(18px); border: 2px solid var(--line-thick); border-radius: 100px; height: 74px; box-shadow: 6px 6px 0 rgba(255,255,255,0.10); transition: box-shadow 0.4s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease); }
        nav.scrolled .nav-container { box-shadow: 6px 6px 0 rgba(255,255,255,0.18); border-color: var(--accent); background: rgba(10,11,9,0.94); }
        .nav-logo-img { height: 42px; width: auto; }
        .desktop-menu { display: none; gap: 4px; }
        .desktop-menu a { color: var(--dim); text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 100px; transition: 0.2s; }
        .desktop-menu a:hover, .desktop-menu a.active { color: var(--ink); background: var(--surf-2); }

        .hamburger-wrapper { position: relative; }
        .hamburger { cursor: pointer; display: flex; flex-direction: column; gap: 6px; background: var(--surf-2); padding: 12px; border-radius: 50%; border: 2px solid var(--line-thick); width: 46px; height: 46px; justify-content: center; align-items: center; }
        .hamburger span { width: 16px; height: 2px; background: var(--ink); border-radius: 2px; }
        .dropdown-menu { position: absolute; top: 62px; right: 0; width: 220px; background: var(--surf); border: 2px solid var(--line-thick); border-radius: 20px; padding: 10px; display: none; flex-direction: column; gap: 3px; box-shadow: 6px 6px 0 rgba(0,0,0,0.5); z-index: 100; }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu a { color: var(--dim); text-decoration: none; font-size: 14px; font-weight: 600; padding: 12px 14px; border-radius: 12px; }
        .dropdown-menu a:hover { background: var(--surf-2); color: var(--ink); }

        /* WRAPPER & HEADER */
        .wrapper { width: 100%; max-width: 620px; margin: 0 auto; padding: 148px 20px 40px; min-height: 100svh; min-height: 100vh; display: flex; flex-direction: column; }
        .sub-tag { display: block; text-align: center; font-family: 'JetBrains Mono'; font-size: 11px; color: var(--dim); letter-spacing: 2px; margin-bottom: 12px; }
        h2 { font-size: 36px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 8px; text-align: center; }
        .sub-head { color: var(--dim); font-size: 14px; text-align: center; margin-bottom: 44px; }

        /* RANK CARDS */
        .rank-container { display: flex; flex-direction: column; gap: 12px; flex: 1; }
        .rank-card {
            display: flex; align-items: center; background: var(--surf); padding: 18px;
            border: 2px solid var(--line-thick); border-radius: var(--r-lg); position: relative;
            overflow: hidden; box-shadow: 5px 5px 0 rgba(0,0,0,0.4); transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
        }
        .rank-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 rgba(0,0,0,0.4); }
        .rank-card.top-1 { border-color: var(--accent); box-shadow: 6px 6px 0 var(--accent); background: linear-gradient(145deg, #12140F, #1c1c1c); }
        .rank-num { width: 40px; font-family: 'JetBrains Mono'; font-weight: 700; font-size: 15px; color: var(--dim); }
        .top-1 .rank-num { color: var(--accent); }

        .brand-logo { width: 52px; height: 52px; border-radius: var(--r-sm); object-fit: cover; margin: 0 14px; border: 2px solid var(--line-thick); background: var(--surf-2); }
        .brand-detail { flex-grow: 1; }
        .brand-name { font-family: 'Space Grotesk'; font-size: 14.5px; font-weight: 700; color: var(--ink); }
        .brand-owner { font-size: 10.5px; color: var(--dim); margin-top: 2px; }

        .manual-scores { display: flex; gap: 6px; margin-top: 9px; }
        .score-tag { font-size: 9px; background: var(--surf-2); padding: 4px 9px; border-radius: 100px; color: var(--accent); border: 1.5px solid var(--line-thick); font-weight: 700; font-family: 'JetBrains Mono'; display: flex; align-items: center; gap: 4px; }

        .power-box { text-align: right; }
        .power-val { font-family: 'JetBrains Mono'; color: var(--accent); font-size: 17px; font-weight: 700; }
        .power-label { font-size: 8px; color: var(--dim); letter-spacing: 1px; margin-top: 3px; }

        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }
        .reveal.in-view { opacity: 1; transform: translateY(0); }

        @media (min-width: 992px) { .desktop-menu { display: flex; } .hamburger-wrapper { display: none; } }
        @media (prefers-reduced-motion: reduce) { .reveal { transition: none !important; opacity: 1 !important; transform: none !important; } }
    </style>
</head>
<body>
    <div id="curtain"><span class="mark">EINHEIT 单元</span></div>

    <nav id="mainNav">
        <div class="nav-container">
            <a href="index.html"><img src="https://files.catbox.moe/iru1fz.png" class="nav-logo-img"></a>
            <div class="desktop-menu">
                <a href="index.html">Home</a><a href="gallery.html">Gallery</a><a href="rank.html" class="active">Rank</a><a href="news.html">News</a><a href="verify.html">Check ID Card</a>
            </div>
            <div class="hamburger-wrapper">
                <div class="hamburger" onclick="toggleMenu()"><span></span><span></span></div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="index.html">Home</a><a href="gallery.html">Gallery</a><a href="rank.html" class="active">Rank</a><a href="news.html">News</a><a href="verify.html">Check ID Card</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <span class="sub-tag reveal">◆ Collective influence measurement</span>
        <h2 class="reveal">Leaderboard.</h2>
        <p class="sub-head reveal">Ranked by design, spec, and community power index.</p>

        <div class="rank-container" id="rankContainer">
            <div class="rank-card skeleton" style="height: 100px; border:2px solid var(--line);"></div>
            <div class="rank-card skeleton" style="height: 100px; border:2px solid var(--line);"></div>
            <div class="rank-card skeleton" style="height: 100px; border:2px solid var(--line);"></div>
        </div>

        <footer class="reveal" style="margin-top: 70px; text-align: center; padding: 40px 0; border-top: 2px solid var(--line);">
            <div style="font-family: 'JetBrains Mono'; font-size: 10px; color: #4b544a; letter-spacing: 1.5px;">© 2026 EINHEIT COLLECTIVE</div>
        </footer>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz3BOaBDg0bsZ8czGV35K2JA0MJMK_GTto9KTA9i7WvyARc0lMy0f19_kKMcEhDyWfX/exec';

        function toggleMenu() {
            document.getElementById('dropdownMenu').classList.toggle('active');
        }

        window.addEventListener('load', () => setTimeout(() => document.getElementById('curtain').classList.add('done'), 300));
        const navEl = document.getElementById('mainNav');
        window.addEventListener('scroll', () => navEl.classList.toggle('scrolled', window.scrollY > 30), { passive: true });

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('in-view'); revealObserver.unobserve(entry.target); }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        function observeReveals(root = document) { root.querySelectorAll('.reveal:not(.in-view)').forEach(el => revealObserver.observe(el)); }
        observeReveals();

        async function loadRank() {
            const container = document.getElementById('rankContainer');
            try {
                const url = `${SCRIPT_URL}?action=getRank&t=${new Date().getTime()}`;
                const response = await fetch(url);
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    renderRank(data);
                } else {
                    container.innerHTML = '<p style="text-align:center;color:#8D9788;">Data rank kosong 😿</p>';
                }
            } catch (err) {
                console.error('Gagal load rank:', err);
                container.innerHTML = '<p style="text-align:center;color:#FF6A3D;">Gagal sinkronisasi data.</p>';
            }
        }

        function renderRank(data) {
            const container = document.getElementById('rankContainer');
            container.innerHTML = data.map((item, index) => `
                <div class="rank-card ${index === 0 ? 'top-1' : ''} reveal" style="transition-delay: ${Math.min(index,8) * 0.06}s">
                    <div class="rank-num">#${index + 1}</div>
                    <img src="${item.logo || 'https://files.catbox.moe/cmhaot.jpg'}" class="brand-logo" onerror="this.src='https://files.catbox.moe/cmhaot.jpg'">
                    <div class="brand-detail">
                        <div class="brand-name">${item.brand || 'UNKNOWN'}</div>
                        <div class="brand-owner">by ${item.owner || 'N/A'}</div>
                        <div class="manual-scores">
                            <span class="score-tag">🎨 ${item.design || '0'}</span>
                            <span class="score-tag">⚙️ ${item.spec || '0'}</span>
                        </div>
                    </div>
                    <div class="power-box">
                        <div class="power-val">${item.power || 0}</div>
                        <div class="power-label">POWER INDEX</div>
                    </div>
                </div>
            `).join('');
            observeReveals(container);
        }

        document.addEventListener('DOMContentLoaded', loadRank);
    </script>
</body>
</html>
