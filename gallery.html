<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EINHEIT | Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:#0A0B09; --surf:#12140F; --surf-2:#191C15;
            --line:#262B22; --line-thick:#3A4234;
            --ink:#F3F5EE; --dim:#8D9788;
            --accent:#FFFFFF; --accent-ink:#0A0B09; --accent-2:#FF6A3D;
            --r-xl:32px; --r-lg:24px; --r-md:16px; --r-sm:10px;
            --max-w-desktop: 1120px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg); color: var(--ink); font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden; width: 100%; -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
        ::selection { background: var(--accent); color: var(--accent-ink); }

        #curtain { position: fixed; inset: 0; background: var(--bg); z-index: 100000; display: flex; align-items: center; justify-content: center; transition: opacity 0.8s var(--ease), visibility 0.8s var(--ease); }
        #curtain.done { opacity: 0; visibility: hidden; pointer-events: none; }
        #curtain .mark { font-family: 'JetBrains Mono'; font-size: 11px; letter-spacing: 6px; color: var(--dim); opacity: 0; animation: markFade 1.2s var(--ease) forwards; }
        @keyframes markFade { 0% { opacity: 0; transform: scale(0.92); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.02); } }

        /* NAVBAR */
        nav { display: flex; justify-content: center; align-items: center; position: fixed; width: 100%; top: 18px; left: 0; z-index: 9999; padding: 0 15px; }
        .nav-container {
            width: 100%; max-width: var(--max-w-desktop); display: flex; justify-content: space-between; align-items: center;
            padding: 0 14px 0 26px;
            background: rgba(18, 20, 15, 0.88);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 2px solid var(--line-thick); border-radius: 100px;
            height: 74px; box-shadow: 6px 6px 0 rgba(255,255,255,0.10);
            transition: box-shadow 0.4s var(--ease), border-color 0.4s var(--ease), background 0.4s var(--ease);
        }
        nav.scrolled .nav-container { box-shadow: 6px 6px 0 rgba(255,255,255,0.18); border-color: var(--accent); background: rgba(10,11,9,0.94); }
        .nav-logo-img { height: 42px; width: auto; flex-shrink: 0; }
        .desktop-menu { display: none; gap: 4px; align-items: center; }
        .desktop-menu a { color: var(--dim); text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 100px; transition: 0.2s; }
        .desktop-menu a:hover, .desktop-menu a.active { color: var(--ink); background: var(--surf-2); }

        .hamburger-wrapper { position: relative; display: flex; align-items: center; }
        .hamburger {
            cursor: pointer; display: flex; flex-direction: column; gap: 5px;
            background: var(--surf-2); padding: 12px; border-radius: 50%; border: 2px solid var(--line-thick);
            width: 46px; height: 46px; justify-content: center; align-items: center;
        }
        .hamburger span { width: 16px; height: 2px; background: var(--ink); border-radius: 2px; }
        .dropdown-menu {
            position: absolute; top: 62px; right: 0; width: 220px;
            background: var(--surf); border: 2px solid var(--line-thick);
            border-radius: 20px; padding: 10px; display: none;
            flex-direction: column; gap: 3px; box-shadow: 6px 6px 0 rgba(0,0,0,0.5);
        }
        .dropdown-menu.active { display: flex; }
        .dropdown-menu a { color: var(--dim); text-decoration: none; font-size: 14px; font-weight: 600; padding: 12px 14px; border-radius: 12px; }
        .dropdown-menu a:hover { background: var(--surf-2); color: var(--ink); }

        /* CONTENT */
        .wrapper { width: 100%; max-width: var(--max-w-desktop); margin: 0 auto; padding: 145px 20px 40px; min-height: 100svh; min-height: 100vh; display: flex; flex-direction: column; }

        .gallery-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px; }
        .gallery-header .tag { font-family: 'JetBrains Mono'; font-size: 11px; color: var(--dim); letter-spacing: 2px; display: block; margin-bottom: 10px; }
        h2 { font-size: clamp(30px, 5vw, 46px); font-weight: 800; letter-spacing: -1.8px; }

        .btn-add-product {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--accent); color: var(--accent-ink); padding: 15px 24px;
            border-radius: 100px; text-decoration: none;
            font-size: 12px; font-weight: 800; white-space: nowrap;
            border: 2px solid var(--accent-ink); box-shadow: 5px 5px 0 rgba(0,0,0,0.5); transition: 0.3s var(--ease);
        }
        .btn-add-product:hover { transform: translate(-2px,-2px); box-shadow: 7px 7px 0 rgba(0,0,0,0.5); background: #e6e6e6; }

        /* GRID */
        .g-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; text-align: left; flex: 1; align-content: start; }

        .g-card {
            background: var(--surf); border: 2px solid var(--line-thick);
            border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.4); transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
        }
        .g-card:hover { transform: translate(-3px,-3px); box-shadow: 8px 8px 0 rgba(0,0,0,0.4); }
        .img-box { width: 100%; aspect-ratio: 1/1; overflow: hidden; background: var(--surf-2); position: relative; border-bottom: 2px solid var(--line-thick); }
        .g-card img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s var(--ease); }
        .g-card:hover img { transform: scale(1.07); }

        .g-info { padding: 16px 18px; flex-grow: 1; }
        .g-info h3 { font-family: 'Inter'; font-size: 12.5px; margin: 0; font-weight: 700; letter-spacing: 0.1px; }
        .g-info p { font-size: 10px; color: var(--dim); margin: 8px 0 0; font-family: 'JetBrains Mono'; letter-spacing: 0.5px; }

        .skeleton { background: linear-gradient(90deg, var(--surf) 25%, var(--surf-2) 50%, var(--surf) 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; }
        @keyframes shimmer { to { background-position: -200% 0; } }

        footer { margin-top: 70px; padding: 44px 0; border-top: 2px solid var(--line); text-align: center; }
        .copyright { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #4b544a; letter-spacing: 1.5px; }

        .reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.8s var(--ease), transform 0.8s var(--ease); }
        .reveal.in-view { opacity: 1; transform: translateY(0); }

        @media (max-width: 600px) {
            .gallery-header { flex-direction: column; align-items: flex-start; gap: 18px; }
            .btn-add-product { width: 100%; justify-content: center; }
            .g-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
        @media (min-width: 992px) {
            .desktop-menu { display: flex; }
            .hamburger-wrapper { display: none; }
            .g-grid { grid-template-columns: repeat(4, 1fr); }
        }
        @media (prefers-reduced-motion: reduce) {
            .reveal { transition: none !important; opacity: 1 !important; transform: none !important; }
        }
    </style>
</head>
<body>

    <div id="curtain"><span class="mark">EINHEIT 单元</span></div>

    <nav id="mainNav">
        <div class="nav-container">
            <a href="index.html"><img src="https://files.catbox.moe/iru1fz.png" class="nav-logo-img"></a>
            <div class="desktop-menu">
                <a href="index.html">Home</a>
                <a href="gallery.html" class="active">Gallery</a>
                <a href="rank.html">Rank</a>
                <a href="news.html">News</a>
                <a href="verify.html">Check ID Card</a>
            </div>
            <div class="hamburger-wrapper">
                <div class="hamburger" onclick="toggleMenu()"><span></span><span></span></div>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a href="index.html">Home</a>
                    <a href="gallery.html">Gallery</a>
                    <a href="rank.html">Rank</a>
                    <a href="news.html">News</a>
                    <a href="verify.html">Check ID Card</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="wrapper">
        <header class="gallery-header reveal">
            <div>
                <span class="tag">◆ Collective registry</span>
                <h2>Einheit Gallery.</h2>
            </div>
            <a href="add-product.html" class="btn-add-product">+ Add Product</a>
        </header>

        <div id="galleryContainer" class="g-grid">
            <div class="g-card sk-item"><div class="img-box skeleton"></div><div class="g-info"><div class="skeleton" style="height:12px; width:60%; border-radius:4px;"></div></div></div>
            <div class="g-card sk-item"><div class="img-box skeleton"></div><div class="g-info"><div class="skeleton" style="height:12px; width:60%; border-radius:4px;"></div></div></div>
        </div>

        <footer class="reveal">
            <div class="copyright">© 2026 EINHEIT COLLECTIVE. ALL RIGHTS RESERVED.</div>
        </footer>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz3BOaBDg0bsZ8czGV35K2JA0MJMK_GTto9KTA9i7WvyARc0lMy0f19_kKMcEhDyWfX/exec';
        const CACHE_KEY = 'einheit_gallery_cache';

        function toggleMenu() { document.getElementById('dropdownMenu').classList.toggle('active'); }

        window.addEventListener('load', () => setTimeout(() => document.getElementById('curtain').classList.add('done'), 300));
        const navEl = document.getElementById('mainNav');
        window.addEventListener('scroll', () => navEl.classList.toggle('scrolled', window.scrollY > 30), { passive: true });

        const revealObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) { entry.target.classList.add('in-view'); revealObserver.unobserve(entry.target); }
            });
        }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
        function observeReveals(root = document) { root.querySelectorAll('.reveal:not(.in-view)').forEach(el => revealObserver.observe(el)); }
        observeReveals();

        // Fungsi Render Data
        function renderGallery(data) {
            const container = document.getElementById('galleryContainer');
            if (!data || data.length === 0) {
                container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #4b544a; padding: 50px;'>No gear available.</p>";
                return;
            }
            container.innerHTML = data.map((item, i) => `
                <div class="g-card reveal" style="transition-delay: ${Math.min(i,8)*0.05}s">
                    <div class="img-box">
                        <img src="${item.img}" loading="lazy" onerror="this.src='https://files.catbox.moe/cmhaot.jpg'">
                    </div>
                    <div class="g-info">
                        <h3>${item.name || 'Unknown Item'}</h3>
                        <p>${item.brand || 'No Brand'}</p>
                    </div>
                </div>
            `).join('');
            observeReveals(container);
        }

        async function fetchGallery() {
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) renderGallery(JSON.parse(cachedData));

            try {
                const response = await fetch(`${scriptURL}?action=getGallery`);
                const data = await response.json();
                if (data && data.length > 0) {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                    renderGallery(data);
                }
            } catch (e) {
                console.error("Fetch Error:", e);
                if (!cachedData) {
                    document.getElementById('galleryContainer').innerHTML = "<p style='grid-column: 1/-1; text-align: center;'>OFFLINE_OR_DATABASE_ERROR</p>";
                }
            }
        }

        fetchGallery();

        window.onclick = function(e) {
            if (!e.target.closest('.hamburger-wrapper')) {
                document.getElementById('dropdownMenu').classList.remove('active');
            }
        }
    </script>
</body>
</html>
